ChannelLabelsHint="What each channel of a packed surround feed carries, e.g. \"L, R, C, LFE\". Only matters for packed multi-channel feeds."
SegmentDurationHint="How long each piece of video is. Shorter means less delay and more requests; longer means fewer requests and more delay. Six seconds suits most event connections."
