RoomIDHint="The name the main site broadcasts under. Every machine watching this room must use exactly the same value — it is what ties this campus to that feed."
VideoBitrateHint="The video quality sent to every campus and to storage, in kbps. Higher looks better and needs more upload from this machine, which carries it once however many campuses are watching."
