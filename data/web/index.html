<title>Multisite — which half?</title>
<link rel="stylesheet" href="/encoder/style.css">
<style>
  /* The shared stylesheet styles buttons; a chooser is two links, and a link
     that looks different from the button beside it looks broken. */

</style>

<body>

<header id="banner">
  <div class="state">Multisite</div>
  <div class="room">This machine does both halves</div>
</header>

<main>
  <p class="hint">
    Pick the side of the building you are standing in. A machine set to one role
    in OBS never shows this page at all — it opens straight into the half it is
    for.
  </p>

  <div class="transport">
    <a class="big go" href="/encoder/">I am sending — the main site</a>
    <a class="big" href="/decoder/">I am receiving — a campus</a>
  </div>
</main>

<footer class="foot">
  <span class="brandline">
    <a href="https://stageaudioworks.github.io/obs-multisite/" target="_blank"
       rel="noopener noreferrer">obs-multisite</a>

     rel="noopener noreferrer" title="Stage Audio Works">

  </a>
