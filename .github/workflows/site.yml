name: Site

# The website is hand-written under site/; the build only fills in the current
# release tag and its download links. Rebuild it whenever those two inputs
# change — a page edit, or a new release — so the site never advertises a
# version that is no longer the latest.
#
# The `release` trigger below looks like it covers a new release, and it
# would — except obs-plugin.yml cuts every release with the default
# GITHUB_TOKEN, and GitHub deliberately does not chain workflow triggers from
# that token (its own anti-recursion rule). So `release: published` fires for
# a release made by hand and silently never fires for the ones CI makes,
# which is every real one. The `workflow_run` trigger is the actual fix: it
# watches "obs plugin build" (the release job's own name, from
# obs-plugin.yml) finish, rather than watching for the release event that
# job's own token can't raise.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CMakeLists.txt'
      - '.github/workflows/site.yml'
  release:
    types: [published, released, edited, deleted]
  workflow_run:
    workflows: ["obs plugin build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-done; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A workflow_run fires on every conclusion, including a failed build —
    # only rebuild the site if the release job actually succeeded, so a
    # broken CI run doesn't spend a deploy pointing at nothing new.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
