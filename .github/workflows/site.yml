name: Site

# The website is hand-written under site/; the build only fills in the current
# release tag and its download links. Rebuild it whenever those two inputs
# change — a page edit, or a new release — so the site never advertises a
# version that is no longer the latest.
#
# The `release` trigger is deliberately NOT used, though it looks like it covers
# a new release. Two reasons, either of which is enough. First, obs-plugin.yml
# cuts every CI release with the default GITHUB_TOKEN, and GitHub deliberately
# does not chain workflow triggers from that token (its anti-recursion rule), so
# `release: published` silently never fires for the releases that matter. Second,
# when it DOES fire — a release published by hand, with a real user token — it
# can never deploy: the `github-pages` environment only permits the main branch,
# so a run whose ref is a tag is rejected by the protection rule ("Tag ... is not
# allowed to deploy to github-pages"). A red run that can never go green is
# worse than no run. The `workflow_run` trigger is the actual mechanism: it
# watches "obs plugin build" (the release job's own name, from obs-plugin.yml)
# finish, on a main ref, which the environment does allow.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CMakeLists.txt'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ["obs plugin build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-done; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A workflow_run fires on every conclusion of every plugin build — every
    # push to main, not only releases — and redeployed an unchanged site each
    # time. Only a successful build of a TAG publishes anything the site
    # shows, so only that one rebuilds it. A tag-triggered run reports the
    # tag as its head_branch (checked on the v0.1.24-alpha run); a push to
    # main reports "main". Page edits still deploy through `push` above.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
