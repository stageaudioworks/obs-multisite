name: obs plugin build

on:
  push:
    branches: [ main, master ]
    # A v* tag builds the same way and publishes the result as a release, so
    # the binaries people download are provably the tagged commit rather than
    # something uploaded by hand.
    tags: [ 'v*' ]
    # Only what the plugin is built from. The Pi player (src/appliance), the
    # relay and the docs are not, and a push touching only those used to
    # build it on three platforms anyway. Path filters are NOT evaluated for
    # tag pushes, so a v* tag always builds and publishes, whatever changed.
    paths:
      - 'src/obs/**'
      - 'src/core/**'
      - 'src/vendor/**'
      - 'data/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/obs-plugin.yml'
  pull_request:
  workflow_dispatch:

# One build per ref at a time. On main a newer push cancels the build it
# supersedes, so a burst of commits builds once, for the last of them — at the
# cost that CI does not say which commit in a burst broke it. Tags and pull
# requests are never cancelled: each is its own ref, and a tag is a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  # Match the OBS version you actually run. The obs-deps version is read from
  # this release's own buildspec.json, so FFmpeg/curl DLL versions line up with
  # what your OBS ships — otherwise the plugin fails to load with error 126.
  OBS_TAG: "32.2.2"
  # Used only if the pinned obs-deps version cannot be read from the OBS source
  # tree. OBS 32 keeps it in CMakePresets.json; older releases used
  # buildspec.json. Keep this matched to OBS_TAG.
  OBS_DEPS_FALLBACK: "2026-07-15"

jobs:
  # Fast guard on our OBS API usage, against distro libobs headers.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install libobs, FFmpeg and libcurl
        run: |
          # apt-get update is allowed to fail here: a hash-sum mismatch on an
          # unrelated third-party repo (observed: dl.google.com/linux/
          # chrome-stable, which GitHub's runner image ships preinstalled for
          # Chrome and which nothing here needs) makes the WHOLE step exit
          # nonzero, even though every repo this job actually depends on is
          # already visible a few lines above as fetched. Deleting that repo's
          # source file first was tried and did not work — its filename on
          # this runner image does not match what Chrome's installer usually
          # writes elsewhere, and guessing again is a worse bet than not
          # depending on this step's exit code at all. What has to actually
          # succeed is the install two lines down, which only needs the
          # indices this job cares about, and those are already current.
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            libobs-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libcurl4-openssl-dev \
            libqrencode-dev libfreetype-dev
          echo "--- versions ---"
          pkg-config --modversion libobs
          pkg-config --modversion libavformat

      - name: Configure (plugin enabled)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_OBS_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify the module exports what it should
        run: |
          set -e
          test -f build/obs-multisite.so
          # The C entry points are unmangled, so these are matched exactly.
          for sym in obs_module_load obs_module_unload obs_module_set_pointer \
                     obs_module_ver obs_module_description \
                     obs_module_post_load; do
            nm -D --defined-only build/obs-multisite.so | grep -q " $sym$" \
              || { echo "MISSING SYMBOL: $sym"; exit 1; }
            echo "ok: $sym"
          done
          # The C++ ones arrive mangled, so they are matched loosely — a
          # mangled name still contains the plain one. They are here on purpose:
          # a MODULE library on ELF links happily with symbols missing, so a
          # source file left out of CMakeLists.txt produces a .so that loads and
          # then fails at the first request or at unload, which nothing else in
          # this job would have caught. That happened once.
          for sym in start_web_ui stop_web_ui plugin_log_line \
                     register_vendor_api unregister_vendor_api; do
            nm -D --defined-only build/obs-multisite.so | grep -q "$sym" \
              || { echo "MISSING SYMBOL: $sym"; exit 1; }
            echo "ok: $sym (mangled)"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: obs-multisite-linux
          path: build/obs-multisite.so

  # Produces the installable Windows plugin, built against the OBS release named
  # in OBS_TAG and that release's matching obs-deps.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $gen = ""
          if (Test-Path $vswhere) {
            $line = & $vswhere -latest -products * -property catalog_productLineVersion
            Write-Host "Visual Studio product line: $line"
            switch ("$line") {
              "2022" { $gen = "Visual Studio 17 2022" }
              "2026" { $gen = "Visual Studio 18 2026" }
              default { $gen = "" }
            }
          }
          if ($gen -eq "") { Write-Host "using CMake's default generator" }
          else { Write-Host "using generator: $gen" }
          echo "CMAKE_GEN=$gen" >> $env:GITHUB_ENV

      - name: Fetch OBS sources and its matching obs-deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:OBS_TAG
          Write-Host "OBS tag: $tag"
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/$tag.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs-src
          $obs = (Get-ChildItem obs-src -Directory | Select-Object -First 1).FullName
          Write-Host "obs source dir: $obs"

          # Where OBS keeps its dependency pins has moved: OBS 32 uses the
          # "dependencies" configure preset in CMakePresets.json, releases up
          # to 31 used a buildspec.json. Read the new location first, then the
          # old, and treat the fallback as a last resort — a fallback that
          # fires unnoticed is how a build ends up against the wrong FFmpeg,
          # which on Windows means OBS failing to load the plugin with error
          # 126 and no indication of which DLL is at fault.
          $depsVer = ""
          $qtVerFound = ""
          $presets = Join-Path $obs "CMakePresets.json"
          if (Test-Path $presets) {
            try {
              $json = Get-Content $presets -Raw | ConvertFrom-Json
              $depPreset = $json.configurePresets | Where-Object { $_.name -eq "dependencies" }
              if ($depPreset) {
                $deps = $depPreset.vendor."obsproject.com/obs-studio".dependencies
                $depsVer = $deps.prebuilt.version
                $qtVerFound = $deps.qt6.version
                if ($depsVer) {
                  Write-Host "obs-deps version from CMakePresets.json: $depsVer"
                }
              } else {
                Write-Host "CMakePresets.json has no 'dependencies' preset"
              }
            } catch {
              Write-Host "could not parse CMakePresets.json: $_"
            }
          }

          if (-not $depsVer) {
            $spec = Get-ChildItem -Recurse $obs -Filter buildspec.json -ErrorAction SilentlyContinue |
                    Select-Object -First 1
            if ($spec) {
              Write-Host "found buildspec: $($spec.FullName)"
              try {
                $json = Get-Content $spec.FullName -Raw | ConvertFrom-Json
                $depsVer = $json.dependencies.prebuilt.version
                if ($json.dependencies.qt6.version) { $qtVerFound = $json.dependencies.qt6.version }
                if ($depsVer) { Write-Host "obs-deps version from buildspec.json: $depsVer" }
              } catch {
                Write-Host "could not parse buildspec.json: $_"
              }
            }
          }

          if (-not $depsVer) {
            $depsVer = $env:OBS_DEPS_FALLBACK
            Write-Host "::warning::Could not read the obs-deps version from OBS $tag; using the fallback $depsVer. If OBS has moved the pin again, check that this still matches."
          }

          $url = "https://github.com/obsproject/obs-deps/releases/download/$depsVer/windows-deps-$depsVer-x64.zip"
          Write-Host "downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile deps.zip
          } catch {
            Write-Host "obs-deps download FAILED for version '$depsVer'."
            Write-Host "Check https://github.com/obsproject/obs-deps/releases for the"
            Write-Host "version matching OBS $tag, then set OBS_DEPS_FALLBACK to it."
            exit 1
          }
          Expand-Archive deps.zip -DestinationPath "$env:GITHUB_WORKSPACE\obs-deps"

          # Qt6, needed for the operator docks and for obs-frontend-api to
          # exist at all (OBS only builds it as part of its Qt UI). OBS pins it
          # separately from the other prebuilts, so use its own version when we
          # managed to read one.
          $qtVer = $depsVer
          if ($qtVerFound) { $qtVer = $qtVerFound }
          Write-Host "Qt6 deps version: $qtVer"
          # Windows Qt6 assets carry a build-config suffix, unlike the base
          # deps zip — e.g. windows-deps-qt6-<ver>-x64-RelWithDebInfo.zip.
          # Try the plausible names rather than assuming one.
          $qtNames = @(
            "windows-deps-qt6-$qtVer-x64-RelWithDebInfo.zip",
            "windows-deps-qt6-$qtVer-x64.zip",
            "windows-deps-qt6-$qtVer-x64-Release.zip"
          )
          $gotQt = $false
          foreach ($n in $qtNames) {
            $qtUrl = "https://github.com/obsproject/obs-deps/releases/download/$qtVer/$n"
            Write-Host "trying $n"
            try {
              Invoke-WebRequest -Uri $qtUrl -OutFile qt6.zip -ErrorAction Stop
              Expand-Archive qt6.zip -DestinationPath "$env:GITHUB_WORKSPACE\obs-deps" -Force
              Write-Host "Qt6 deps unpacked from $n"
              $gotQt = $true
              break
            } catch {
              Write-Host "  not available"
            }
          }
          if ($gotQt) {
            # Confirm the Qt6 CMake package is actually present before relying on it.
            $qtCmake = Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\obs-deps" `
                         -Filter Qt6Config.cmake -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if ($qtCmake) {
              Write-Host "Qt6Config.cmake: $($qtCmake.FullName)"
              echo "HAVE_QT=1" >> $env:GITHUB_ENV
            } else {
              Write-Host "Qt6 zip unpacked but Qt6Config.cmake not found — building WITHOUT the docks"
              echo "HAVE_QT=0" >> $env:GITHUB_ENV
            }
          } else {
            Write-Host "no Qt6 deps asset matched for version '$qtVer' — building WITHOUT the docks"
            Write-Host "check https://github.com/obsproject/obs-deps/releases/tag/$qtVer for the asset name"
            echo "HAVE_QT=0" >> $env:GITHUB_ENV
          }

          echo "OBS_SRC=$obs" >> $env:GITHUB_ENV
          echo "OBS_DEPS=$env:GITHUB_WORKSPACE\obs-deps" >> $env:GITHUB_ENV

      - name: Build libobs
        shell: pwsh
        run: |
          $genArgs = @()
          if ($env:CMAKE_GEN -ne "") { $genArgs += @("-G", $env:CMAKE_GEN, "-A", "x64") }
          # obs-frontend-api lives in OBS's UI subproject, so the UI has to be
          # CONFIGURED for it to exist — but only the libobs and
          # obs-frontend-api targets are BUILT, not the whole OBS app.
          # GITHUB_ENV only affects LATER steps, so track the decision locally
          # within this step and publish it once at the end.
          $haveQt = ($env:HAVE_QT -eq "1")
          $uiFlag = if ($haveQt) { "-DENABLE_UI=ON" } else { "-DENABLE_UI=OFF" }
          cmake -S $env:OBS_SRC -B obs-build @genArgs `
            -DCMAKE_PREFIX_PATH="$env:OBS_DEPS" `
            -DENABLE_PLUGINS=OFF $uiFlag -DENABLE_SCRIPTING=OFF `
            -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF -DENABLE_VLC=OFF `
            -DENABLE_VIRTUALCAM=OFF -DBUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "libobs CONFIGURE failed (UI flag: $uiFlag)"
            if ($haveQt) {
              Write-Host "retrying without the UI — docks will be omitted"
              $haveQt = $false
              cmake -S $env:OBS_SRC -B obs-build @genArgs `
                -DCMAKE_PREFIX_PATH="$env:OBS_DEPS" `
                -DENABLE_PLUGINS=OFF -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF `
                -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF -DENABLE_VLC=OFF `
                -DENABLE_VIRTUALCAM=OFF -DBUILD_TESTS=OFF `
                -DCMAKE_BUILD_TYPE=Release
              if ($LASTEXITCODE -ne 0) { Write-Host "libobs CONFIGURE failed again"; exit 1 }
            } else { exit 1 }
          }
          cmake --build obs-build --config Release --target libobs
          if ($LASTEXITCODE -ne 0) { Write-Host "libobs BUILD failed"; exit 1 }

          if ($haveQt) {
            cmake --build obs-build --config Release --target obs-frontend-api
            if ($LASTEXITCODE -ne 0) {
              Write-Host "obs-frontend-api build failed — omitting the docks"
              $haveQt = $false
            } else {
              $fe = Get-ChildItem -Recurse obs-build -Filter obs-frontend-api.lib -ErrorAction SilentlyContinue |
                    Select-Object -First 1
              if ($fe) {
                Write-Host "obs-frontend-api.lib: $($fe.FullName)"
                echo "LIBOBS_FRONTEND_LIBRARY=$($fe.FullName)" >> $env:GITHUB_ENV
                # The header is in the OBS SOURCE tree, not with the libobs
                # headers — find it rather than assuming its location, since
                # OBS moved it (UI/obs-frontend-api -> frontend/api).
                $feh = Get-ChildItem -Recurse $env:OBS_SRC -Filter obs-frontend-api.h -ErrorAction SilentlyContinue |
                       Select-Object -First 1
                if ($feh) {
                  Write-Host "obs-frontend-api.h: $($feh.FullName)"
                  echo "LIBOBS_FRONTEND_INCLUDE_DIR=$($feh.Directory.FullName)" >> $env:GITHUB_ENV
                } else {
                  Write-Host "obs-frontend-api.h not found — omitting the docks"
                  $haveQt = $false
                }
              } else {
                Write-Host "obs-frontend-api.lib not found — omitting the docks"
                $haveQt = $false
              }
            }
          }
          # Publish the final decision for the configure step.
          echo "HAVE_QT=$(if ($haveQt) { '1' } else { '0' })" >> $env:GITHUB_ENV

          $obslib = Get-ChildItem -Recurse obs-build -Filter obs.lib -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $obslib) { Write-Host "obs.lib not found after build"; exit 1 }
          Write-Host "obs.lib: $($obslib.FullName)"
          $obscfg = Get-ChildItem -Recurse obs-build -Filter obsconfig.h -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $obscfg) { Write-Host "obsconfig.h not found"; exit 1 }
          Write-Host "obsconfig.h: $($obscfg.FullName)"

          echo "LIBOBS_LIBRARY=$($obslib.FullName)" >> $env:GITHUB_ENV
          echo "LIBOBS_INCLUDE_DIR=$env:OBS_SRC\libobs" >> $env:GITHUB_ENV
          echo "LIBOBS_CONFIG_INCLUDE_DIR=$($obscfg.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Configure plugin
        shell: pwsh
        run: |
          $genArgs = @()
          if ($env:CMAKE_GEN -ne "") { $genArgs += @("-G", $env:CMAKE_GEN, "-A", "x64") }
          $qtArgs = @()
          if ($env:HAVE_QT -eq "1") {
            $qtArgs += @("-DENABLE_QT=ON",
                         "-DLIBOBS_FRONTEND_LIBRARY=$env:LIBOBS_FRONTEND_LIBRARY",
                         "-DLIBOBS_FRONTEND_INCLUDE_DIR=$env:LIBOBS_FRONTEND_INCLUDE_DIR")
            Write-Host "building WITH the operator docks"
          } else {
            Write-Host "building WITHOUT the docks (hotkeys still included)"
          }
          cmake -S . -B build @genArgs @qtArgs `
            -DBUILD_OBS_PLUGIN=ON `
            -DCMAKE_PREFIX_PATH="$env:OBS_DEPS" `
            -DLIBOBS_INCLUDE_DIR="$env:LIBOBS_INCLUDE_DIR" `
            -DLIBOBS_LIBRARY="$env:LIBOBS_LIBRARY" `
            -DLIBOBS_CONFIG_INCLUDE_DIR="$env:LIBOBS_CONFIG_INCLUDE_DIR"

      - name: Build plugin
        run: cmake --build build --config Release

      # Error 126 on load ("module could not be found") means a DEPENDENCY DLL is
      # missing, not the plugin. List imports so we know exactly what OBS must
      # provide at runtime.
      - name: Report runtime DLL dependencies
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter obs-multisite.dll |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Host "obs-multisite.dll not found under build/"
            Get-ChildItem -Recurse build -Filter *.dll | Select-Object FullName | Format-Table -AutoSize
            exit 1
          }
          Write-Host "built: $($dll.FullName)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vsroot\VC\Tools\MSVC" -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "--- required DLLs (imports) ---"
            & $dumpbin.FullName /dependents $dll.FullName
          } else {
            Write-Host "dumpbin not found; skipping import listing"
          }
          echo "PLUGIN_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      # Ship the FFmpeg/curl DLLs the plugin needs alongside it, so it loads even
      # if OBS's own copies differ in version.
      #
      # Laid out as one self-contained directory per plugin — bin\64bit\ and
      # data\ underneath it — which is what OBS's own plugins guide now
      # recommends and says of the old obs-plugins\/data\obs-plugins\ split:
      # "Plugins in this location will stop working in a future version of
      # OBS." (see BUGS.md entry 2, fixed here). The install root moves with
      # it: this whole directory is copied into
      # C:\ProgramData\obs-studio\plugins\, not merged into OBS's own
      # Program Files tree.
      - name: Stage plugin with its dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/obs-multisite/bin/64bit | Out-Null
          New-Item -ItemType Directory -Force -Path dist/obs-multisite/data | Out-Null
          Copy-Item $env:PLUGIN_DLL dist/obs-multisite/bin/64bit/
          Copy-Item -Recurse data/* dist/obs-multisite/data/ -ErrorAction SilentlyContinue

          # obs-deps runtime DLLs matching what we linked against.
          $names = @("avcodec-*.dll","avformat-*.dll","avutil-*.dll",
                     "swresample-*.dll","swscale-*.dll","libcurl.dll","zlib.dll")
          foreach ($n in $names) {
            Get-ChildItem -Recurse "$env:OBS_DEPS" -Filter $n -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "bundling $($_.Name)"
                Copy-Item $_.FullName dist/obs-multisite/bin/64bit/ -Force
              }
          }
          # Record which build this is, so a dockless fallback is obvious from
          # the artifact rather than only from the log. Kept to simple
          # single-line statements: a multi-line if-expression breaks the
          # PowerShell parser here and silently drops the next argument.
          $mode = "hotkeys only (no Qt docks)"
          if ($env:HAVE_QT -eq "1") { $mode = "with operator docks (Qt)" }
          $info = "obs-multisite build" + [Environment]::NewLine +
                  "OBS tag:  $env:OBS_TAG" + [Environment]::NewLine +
                  "UI mode:  $mode"
          # The commit, because a crash dump does not name the build and we had
          # to ASK which version faulted (2026-09-20).
          $info = $info + [Environment]::NewLine + "Commit:   $env:GITHUB_SHA"
          Set-Content -Path dist/BUILD-INFO.txt -Value $info

          # ── Debug symbols ───────────────────────────────────────────────────
          # MSVC already writes a .pdb for a Release build; it was simply left
          # in the build tree and thrown away with the runner. Without it a
          # Windows crash report is a wall of hex — an access violation in this
          # DLL on 2026-09-20 could not be read at all, and the addresses cannot
          # be recovered later because a PDB only matches the exact binary it
          # was built with.
          #
          # Kept in the CI ARTIFACT, not in the release download: it is a
          # debugging tool rather than something an operator needs, and it is
          # far larger than the DLL.
          $pdb = Get-ChildItem -Recurse build -Filter obs-multisite.pdb |
                 Select-Object -First 1
          if ($pdb) {
            New-Item -ItemType Directory -Force -Path dist-symbols | Out-Null
            Copy-Item $pdb.FullName dist-symbols/
            Copy-Item $dll.FullName dist-symbols/   # the DLL it matches, by GUID
            Set-Content -Path dist-symbols/BUILD-INFO.txt -Value $info
            Write-Host "symbols staged: $($pdb.FullName)"
          } else {
            Write-Host "WARNING: no obs-multisite.pdb found — crashes from this build will not be readable"
          }
          Write-Host "BUILD MODE: $mode"

          # NOTE: Qt itself is NOT bundled. OBS ships its own Qt6 and a plugin
          # must use the host's copy — shipping a second Qt would either be
          # ignored or cause a version clash.
          Write-Host "--- staged ---"
          Get-ChildItem -Recurse dist | Select-Object FullName | Format-Table -AutoSize

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: obs-multisite-windows
          path: dist/

      # Separate artifact so the symbols are fetched only when a crash needs
      # reading, and never end up in the public release download.
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: obs-multisite-windows-symbols
          path: dist-symbols/
          if-no-files-found: warn

  # Produces the installable macOS plugin: an arm64 .plugin bundle that links
  # nothing OBS does not already ship.
  #
  # The whole difficulty on macOS is ABI matching. OBS.app carries its own
  # FFmpeg, Qt and libobs, and a plugin must use those exact copies — a build
  # against Homebrew's FFmpeg or Qt loads on the machine that built it and
  # crashes elsewhere, because the versions differ (Homebrew tracks latest;
  # OBS pins). So the dependencies here come from obs-deps at the version OBS
  # itself pins for this release, which makes the match true by construction
  # rather than by luck.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Read the obs-deps version OBS pins for this release
        run: |
          set -euo pipefail
          TAG="${OBS_TAG}"
          echo "OBS tag: ${TAG}"
          # OBS 32 keeps the dependency pins in CMakePresets.json, under the
          # "dependencies" configure preset. Releases up to 31 used a
          # buildspec.json at the root. Try both, in that order, and fall back
          # only if neither parses — an unnoticed fallback is how you end up
          # linking the wrong FFmpeg.
          VER=""
          if curl -sfSL -o presets.json \
               "https://raw.githubusercontent.com/obsproject/obs-studio/${TAG}/CMakePresets.json"; then
            VER=$(python3 -c "import json; d=json.load(open('presets.json')); print(next((p['vendor']['obsproject.com/obs-studio']['dependencies']['prebuilt']['version'] for p in d.get('configurePresets',[]) if p.get('name')=='dependencies'), ''))" 2>/dev/null || true)
            [ -n "${VER}" ] && echo "obs-deps version from CMakePresets.json: ${VER}"
          fi
          if [ -z "${VER}" ] && curl -sfSL -o buildspec.json \
               "https://raw.githubusercontent.com/obsproject/obs-studio/${TAG}/buildspec.json"; then
            VER=$(python3 -c "import json; print(json.load(open('buildspec.json')).get('dependencies',{}).get('prebuilt',{}).get('version',''))" 2>/dev/null || true)
            [ -n "${VER}" ] && echo "obs-deps version from buildspec.json: ${VER}"
          fi
          if [ -z "${VER}" ]; then
            VER="${OBS_DEPS_FALLBACK}"
            echo "::warning::Could not read the obs-deps version from OBS ${TAG}; using the fallback ${VER}. If OBS has moved the pin again, check that this still matches."
          fi
          echo "DEPS_VER=${VER}" >> "$GITHUB_ENV"

      - name: Fetch obs-deps and the OBS headers
        run: |
          set -euo pipefail
          VER="${DEPS_VER}"
          mkdir -p deps/root
          # arm64 rather than the universal asset OBS builds with: the arm64
          # slice is byte-identical in ABI and the download is half the size.
          for name in "macos-deps-${VER}-arm64.tar.xz" \
                      "macos-deps-qt6-${VER}-arm64.tar.xz"; do
            url="https://github.com/obsproject/obs-deps/releases/download/${VER}/${name}"
            echo "downloading ${name}"
            curl -sfSL -o "${name}" "${url}" || {
              echo "::error::obs-deps asset ${name} not found."
              echo "Check https://github.com/obsproject/obs-deps/releases/tag/${VER}"
              exit 1
            }
            tar xf "${name}" -C deps/root
          done

          # Headers only — the plugin is linked with -undefined dynamic_lookup
          # and resolves libobs and obs-frontend-api out of the running OBS at
          # load time, so no OBS binary is needed to build against.
          curl -sfSL -o obs.tar.gz \
            "https://github.com/obsproject/obs-studio/archive/refs/tags/${OBS_TAG}.tar.gz"
          tar xzf obs.tar.gz
          OBS_SRC="$PWD/obs-studio-${OBS_TAG}"
          test -f "${OBS_SRC}/libobs/obs-module.h"
          test -f "${OBS_SRC}/frontend/api/obs-frontend-api.h" \
            || test -f "${OBS_SRC}/UI/obs-frontend-api/obs-frontend-api.h"

          # obsconfig.h is generated into OBS's own build tree, and a plugin
          # needs only the two version defines from it. Standing one up here
          # avoids configuring the whole of OBS for a header with two lines
          # that matter.
          mkdir -p gen
          printf '%s\n' '#pragma once' \
                         '#define OBS_RELEASE_CANDIDATE 0' \
                         '#define OBS_BETA 0' > gen/obsconfig.h

          FE="${OBS_SRC}/frontend/api"
          [ -d "${FE}" ] || FE="${OBS_SRC}/UI/obs-frontend-api"

          echo "OBS_SRC=${OBS_SRC}" >> "$GITHUB_ENV"
          echo "OBS_FE_INC=${FE}" >> "$GITHUB_ENV"
          echo "DEPS=$PWD/deps/root" >> "$GITHUB_ENV"
          echo "OBSCONFIG=$PWD/gen" >> "$GITHUB_ENV"
          echo "--- deps versions actually fetched ---"
          ls deps/root/lib | grep -E '^libavcodec\.[0-9]+\.' || true
          grep -m1 'PACKAGE_VERSION "' deps/root/lib/cmake/Qt6/Qt6ConfigVersionImpl.cmake || true

      - name: Configure
        run: |
          set -euo pipefail
          # Every FFmpeg path is passed explicitly, and Qt6_DIR is pinned to
          # the deps tree. The runner has Homebrew FFmpeg and Qt installed, and
          # either would be found first and silently produce the mismatched
          # build this job exists to avoid.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_OBS_PLUGIN=ON -DENABLE_QT=ON \
            -DCMAKE_PREFIX_PATH="${DEPS}" \
            -DQt6_DIR="${DEPS}/lib/cmake/Qt6" \
            -DFORCE_FFMPEG_MANUAL_SEARCH=ON \
            -DFFMPEG_INCLUDE_DIR="${DEPS}/include" \
            -DFFMPEG_avformat_LIBRARY="${DEPS}/lib/libavformat.dylib" \
            -DFFMPEG_avcodec_LIBRARY="${DEPS}/lib/libavcodec.dylib" \
            -DFFMPEG_avutil_LIBRARY="${DEPS}/lib/libavutil.dylib" \
            -DFFMPEG_swresample_LIBRARY="${DEPS}/lib/libswresample.dylib" \
            -DFFMPEG_swscale_LIBRARY="${DEPS}/lib/libswscale.dylib" \
            -DLIBOBS_INCLUDE_DIR="${OBS_SRC}/libobs" \
            -DLIBOBS_CONFIG_INCLUDE_DIR="${OBSCONFIG}" \
            -DLIBOBS_FRONTEND_INCLUDE_DIR="${OBS_FE_INC}"

      - name: Build
        run: cmake --build build --config Release --target obs-multisite

      # These checks are the difference between "it built" and "it will load on
      # someone else's Mac". Each one has a failure mode that is invisible
      # until a stranger downloads the plugin.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          B=build/obs-multisite.plugin
          BIN="$B/Contents/MacOS/obs-multisite"
          test -d "$B" || { echo "::error::no .plugin bundle was produced"; exit 1; }
          test -f "$BIN" || { echo "::error::bundle has no executable"; exit 1; }

          # OBS skips a bundle whose package type is not BNDL, without logging
          # anything — indistinguishable from a plugin that failed to build.
          TYPE=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" \
                   "$B/Contents/Info.plist")
          echo "CFBundlePackageType: ${TYPE}"
          [ "${TYPE}" = "BNDL" ] || { echo "::error::package type must be BNDL"; exit 1; }

          # obs_module_text reads the locale files out of Contents/Resources.
          test -f "$B/Contents/Resources/locale/en-US.ini" \
            || { echo "::error::locale files missing from the bundle"; exit 1; }

          echo "--- architecture ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64 \
            || { echo "::error::not an arm64 build"; exit 1; }

          echo "--- OBS entry points ---"
          for sym in obs_module_load obs_module_unload obs_module_set_pointer \
                     obs_module_ver obs_module_description \
                     obs_module_post_load; do
            nm -gU "$BIN" | grep -q " _${sym}$" \
              || { echo "::error::missing exported symbol ${sym}"; exit 1; }
            echo "ok: ${sym}"
          done

          echo "--- linked libraries ---"
          otool -L "$BIN"

          # A path from the build machine baked into the binary is the classic
          # way an unsigned plugin "works for me" and nowhere else.
          STRAY=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
                  | grep -Ev '^@rpath/|^/System/|^/usr/lib/' || true)
          if [ -n "${STRAY}" ]; then
            echo "::error::these are neither @rpath nor OS paths, so they will not"
            echo "::error::exist on another machine:"
            echo "${STRAY}"
            exit 1
          fi

          # @rpath must resolve through the HOST application, because a plugin
          # has no executable of its own: @executable_path is OBS.app/Contents/
          # MacOS, so ../Frameworks is OBS's framework directory wherever OBS
          # happens to be installed.
          echo "--- rpaths ---"
          RPATHS=$(otool -l "$BIN" | grep -A2 LC_RPATH | awk '/ path /{print $2}')
          echo "${RPATHS}"
          [ "${RPATHS}" = "@executable_path/../Frameworks" ] \
            || { echo "::error::expected exactly one rpath," \
                      "@executable_path/../Frameworks, got: ${RPATHS}"; exit 1; }

          # The crypto backend must be the platform's own. An OpenSSL link
          # would fail to load on any Mac without Homebrew, which is most of
          # them, and the failure looks like a broken plugin rather than a
          # missing library.
          if otool -L "$BIN" | grep -qi 'libssl\|libcrypto'; then
            echo "::error::OpenSSL is linked; macOS must use CommonCrypto"
            exit 1
          fi
          echo "ok: no OpenSSL"

      # Recording what the binary expects makes a future ABI drift readable
      # from the download rather than only from a crash report.
      - name: Stage for release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R build/obs-multisite.plugin dist/
          BIN=dist/obs-multisite.plugin/Contents/MacOS/obs-multisite
          {
            echo "obs-multisite — macOS (Apple Silicon)"
            echo
            echo "Built against OBS ${OBS_TAG}, obs-deps ${DEPS_VER}."
            echo "Links nothing OBS does not already ship; resolves it from"
            echo "the running OBS.app, so no libraries are bundled."
            echo
            echo "Expected library versions:"
            otool -L "$BIN" | tail -n +2 | grep '^\s*@rpath' \
              | sed 's/^[[:space:]]*/  /'
            echo
            echo "Install:"
            echo "  1. Move obs-multisite.plugin to"
            echo "     ~/Library/Application Support/obs-studio/plugins/"
            echo "  2. Remove the download quarantine flag, or macOS will"
            echo "     refuse to load it — this build is not signed:"
            echo "     xattr -dr com.apple.quarantine \\"
            echo "       ~/Library/Application\\ Support/obs-studio/plugins/obs-multisite.plugin"
            echo "  3. Restart OBS."
          } > dist/INSTALL-MACOS.txt
          cat dist/INSTALL-MACOS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: obs-multisite-macos-arm64
          path: dist/

  # Publishes the release only for a v* tag; ordinary pushes just build.
  release:
    needs: [ linux, windows, macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/checkout@v5

      - name: Collect the built plugins
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # One archive per platform, named for the tag so a downloaded file still
      # says what it is months later.
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p dist
          # Windows: the staged tree (plugin + its runtime DLLs + locale data),
          # laid out as one self-contained obs-multisite\ directory to be
          # copied straight into C:\ProgramData\obs-studio\plugins\.
          (cd artifacts/obs-multisite-windows && zip -r "../../dist/obs-multisite-${VER}-windows-x64.zip" .)
          # Linux: the module alone. Distros vary too much for a staged tree to
          # be useful, and the plugin links the system FFmpeg/curl.
          (cd artifacts/obs-multisite-linux && tar czf "../../dist/obs-multisite-${VER}-linux-x86_64.tar.gz" .)
          # macOS: zip rather than tar, because unzipping in Finder is the
          # path of least resistance and it preserves the bundle. -y keeps
          # symlinks as symlinks, which matters for a .plugin's Contents.
          (cd artifacts/obs-multisite-macos-arm64 && \
             zip -ry "../../dist/obs-multisite-${VER}-macos-arm64.zip" .)
          ls -lh dist

      # Creating and uploading are separate so this is safe to run again.
      # `gh release create` fails outright if the release already exists, which
      # it does whenever a release was drafted by hand or a previous run got as
      # far as creating it — and the failure lands BEFORE the upload, so the
      # release sits there with no plugin attached and nothing says why.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — uploading to it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file .github/RELEASE-NOTES.md \
              --prerelease
          fi
          # --clobber so a re-run replaces the files rather than failing on
          # names that are already there.
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      # The whole point of the job is that a release has something to download.
      # A release published with no plugin attached is worse than a failed
      # build, because it looks finished.
      - name: Check the release actually has the plugins on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                    --json assets -q '.assets | length')
          echo "${count} asset(s) attached to ${GITHUB_REF_NAME}"
          if [ "${count}" -lt 3 ]; then
            echo "::error::Expected the Windows, Linux and macOS builds to be attached, found ${count}."
            exit 1
          fi
